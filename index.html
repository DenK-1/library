<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="library">
        <p>What books have you read? Fill out the form</p>
        <button id="add-book-button">Add Books</button>
        <!--  <button id="show-books">Show all books</button> -->
    </div>
    <form id="add-book-form">
        <p>Please add the book</p>
        <label>Name <input required type="text"></label>
        <label>Author <input required type="text"></label>
        <label>Number of pages <input required type="text"></label>
        <label>Read <input type="checkbox"></label>
        <button id="addBook" type="submit">Add book</button>
        <button id="close-book">close</button>
    </form>
    <div id="all-books">
        <div class="shelf">
            <span class="titleBooks">BOOKS</span>
        </div>
    </div>
    <script src="js.js"></script>
</body>

</html>
