<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="library">
        <p>What books have you read? Fill out the form</p>
        <button id="addBook">Add Books</button>
        <button id="showBooks">Show all books</button>
        <dialog id="dialog">
            <form method="dialog">
                <p>Please add the book</p>
                <label>Name<input type="text"></label>
                <label>Author<input type="text"></label>
                <label>Number of pages<input type="text"></label>
                <label>Read<input type="checkbox"></label>
                <button id="diagClose">Add book</button>

            </form>
        </dialog>
    </div>
    <script src="js.js"></script>
</body>

</html>
